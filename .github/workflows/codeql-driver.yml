# Runs the CodeQL driver analysis as a build option, the same way the Windows
# Hardware Compatibility Program expects it, and archives the results.
#
# This complements the codeql.yml workflow: that one uploads CodeQL results to
# GitHub code scanning using github/codeql-action, while this one runs the
# analysis out of the BuildTools build script so that the resulting SARIF file
# and driver verification log are build artifacts, produced by the same toolset
# as the shipped binaries.
#
# See BuildTools/docs/codeql.md for the tooling, versions and suites.

name: "CodeQL Driver Analysis"

on:
  push:
    branches:
      - main
      - feature-*
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'

  # Allow manual scheduling
  workflow_dispatch:

env:

  # The build is configured by codeql.build.json, and the CodeQL toolchain - the
  # CLI version, the query packs, dvl.exe - by BuildTools\codeql.json. This
  # workflow names neither, so there is one place per concern to change, and the
  # installed versions are exactly the pinned ones.
  ARCHIVE_PREFIX: codeql-analysis

jobs:
  analyze:
    name: Analysis
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0 # required for generating version number

      - name: Setup NuGet
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Install CodeQL CLI and query packs
        run: .\BuildTools\codeql.ps1 -install

      # The build options - toolset, configuration, suite, dvl - live in
      # codeql.build.json. Values from a build JSON file override parameters
      # passed on the command line, so passing -toolset or -codeqlSuite here
      # would be silently ignored; change codeql.build.json instead.
      - name: Build with CodeQL analysis
        run: >
          .\BuildTools\build.ps1
          -jsonFile .\codeql.build.json

      - name: Archive CodeQL results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.ARCHIVE_PREFIX}}-results
          path: |
            logs/codeql/*.sarif
            logs/codeql/*.DVL.XML
          if-no-files-found: warn
          retention-days: 14

      - name: Archive logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.ARCHIVE_PREFIX}}-logs
          path: logs/**/*.log

      - name: Archive Bin
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.ARCHIVE_PREFIX}}-bin
          path: bin/**/*.*
